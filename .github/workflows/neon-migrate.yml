# Apply Prisma migrations + full demo seed to Neon after every push to main.
# Repo secret required: DATABASE_URL (Neon, with ?sslmode=require)

name: Neon migrate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: neon-migrate-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w @frs/db

      - name: Migrate and seed Neon (users, clients, bid masters, demo)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/seed-deploy.mjs

      - name: Verify seed counts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/verify-seed.mjs
